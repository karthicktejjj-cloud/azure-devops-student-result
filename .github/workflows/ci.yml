name: Student Result Portal CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Project Files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f README.md
          echo "All required project files are present."

      - name: Run Application Tests
        run: |
          grep -q "Student Result Portal" index.html
          grep -q "calculateResult" script.js
          echo "Application tests passed successfully."

      - name: Build Application Package
        run: |
          mkdir build
          cp index.html style.css script.js README.md build/
          echo "Build completed successfully."

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-result-portal
          path: build/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4