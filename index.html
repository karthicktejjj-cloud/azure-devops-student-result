<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <div class="logo">SR</div>
            <div>
                <h1>Student Result Portal</h1>
                <p>Academic Performance Management System • CI/CD Enabled</p>
            </div>
        </header>

        <main>

            <section class="card">
                <h2>Enter Student Details</h2>

                <div class="form-grid">
                    <div class="input-group">
                        <label>Student Name</label>
                        <input type="text" id="studentName" placeholder="Enter student name">
                    </div>

                    <div class="input-group">
                        <label>Register Number</label>
                        <input type="text" id="registerNumber" placeholder="Enter register number">
                    </div>
                </div>

                <h3>Subject Marks</h3>

                <div class="marks-grid">
                    <div class="input-group">
                        <label>DevOps</label>
                        <input type="number" id="devops" min="0" max="100" placeholder="0 - 100">
                    </div>

                    <div class="input-group">
                        <label>Cloud Computing</label>
                        <input type="number" id="cloud" min="0" max="100" placeholder="0 - 100">
                    </div>

                    <div class="input-group">
                        <label>Database</label>
                        <input type="number" id="database" min="0" max="100" placeholder="0 - 100">
                    </div>

                    <div class="input-group">
                        <label>Computer Networks</label>
                        <input type="number" id="networks" min="0" max="100" placeholder="0 - 100">
                    </div>
                </div>

                <button onclick="calculateResult()">Calculate Result</button>

            </section>

            <section class="card result-card" id="resultCard">
                <h2>Result</h2>

                <div class="student-info">
                    <p><strong>Name:</strong> <span id="resultName">-</span></p>
                    <p><strong>Register No:</strong> <span id="resultRegister">-</span></p>
                </div>

                <div class="result-stats">
                    <div>
                        <span>Total</span>
                        <strong id="total">0</strong>
                    </div>

                    <div>
                        <span>Percentage</span>
                        <strong id="percentage">0%</strong>
                    </div>

                    <div>
                        <span>Grade</span>
                        <strong id="grade">-</strong>
                    </div>

                    <div>
                        <span>Status</span>
                        <strong id="status">-</strong>
                    </div>
                </div>

                <p id="message" class="message"></p>
            </section>

        </main>

        <footer>
            <p>Student Result Portal • DevOps Demonstration Project</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
